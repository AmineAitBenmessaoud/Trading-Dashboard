spring.application.name=market-service
server.port=8082

# Redis Configuration (Docker network)
spring.data.redis.host=redis
spring.data.redis.port=6379

# Kafka Configuration (Docker network)
spring.kafka.bootstrap-servers=kafka:29092

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Market API Configuration
market.api.base-url=https://www.alphavantage.co
market.api.key=C381ZF21PEIJLVPM
market.scheduler.refresh-interval=300000

# Actuator for health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Logging
logging.level.com.trading.backend.marketservice=DEBUG
